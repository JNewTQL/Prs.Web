<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Request System</title>
    <style>
      body {
        margin: 0;
        font-family:
          "Raleway",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #212529;
      }

      .app-loading {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        background: rgb(214, 242, 255);
        background: radial-gradient(circle, rgba(214, 242, 255, 1) 31%, rgba(237, 250, 255, 1) 60%);
      }

      .app-loading__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        animation: app-loading-pulse 1.6s ease-in-out infinite;
      }

      .app-loading__name {
        font-size: 1.125rem;
        font-weight: 600;
        color: #212529;
      }

      @keyframes app-loading-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      .app-loading__bar {
        width: 12rem;
        height: 0.25rem;
        border-radius: 999px;
        background: rgba(255, 122, 0, 0.15);
        overflow: hidden;
      }

      .app-loading__bar::before {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #007aff;
        animation: app-loading-slide 1.3s ease-in-out infinite;
      }

      @keyframes app-loading-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading__brand {
          animation: none;
        }
        .app-loading__bar::before {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }

      .app-loading__status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading__brand">
          <svg width="100" height="78" viewBox="0 0 78 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.4992 2H37.5808L22.0816 24.9729H1L16.4992 2Z" fill="#007AFF" />
            <path d="M17.4224 27.102L11.4192 36H33.5008L49 13.0271H32.7024L23.2064 27.102H17.4224Z" fill="#312ECB" />
          </svg>
          <span class="app-loading__name">Purchase Request System</span>
        </div>
        <div class="app-loading__bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
